[package]
name = "rusty-bubbletea"
exclude = ["POLICIES.md"]
version = "2.0.8"
edition = "2021"
rust-version = "1.91"
description = "Cleanroom Rust port of Charmbracelet's Bubble Tea (v2.0.8) TUI Elm architecture framework"
license = "MIT"

[dependencies]
rusty-colorprofile = { version = "0.4.3", path = "../rusty-colorprofile" }
rusty-lipgloss = { version = "2.0.5", path = "../rusty-lipgloss" }
rusty-ultraviolet = { version = "0.0.0-20260703014108-f5a850f9c2b7", path = "../rusty-ultraviolet" }
rusty-x-ansi = { version = "0.11.7", path = "../rusty-x-ansi" }
unicode-segmentation = "1.10.1"
libc = "0.2"
tokio = { version = "1.38", features = ["full"] }
tokio-stream = "0.1"
crossterm = "0.27"
futures = "0.3"

[dev-dependencies]
rusty-testkit = { version = "0.1.1", path = "../rusty-testkit" }
tokio-test = "0.4"
rusty-bubbles = { version = "2.1.0", path = "../rusty-bubbles" }

[lib]
name = "rusty_bubbletea"
path = "src/lib.rs"
