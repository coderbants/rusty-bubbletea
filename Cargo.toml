[package]
name = "charming-bubbletea"
version = "2.0.8"
edition = "2021"
description = "Cleanroom Rust port of Charmbracelet's Bubble Tea (v2.0.8) TUI Elm architecture framework"
license = "MIT"

[dependencies]
charming-lipgloss = { version = "2.0.5", path = "../charming-lipgloss" }
charming-ultraviolet = { path = "../charming-ultraviolet" }
charming-x-ansi = { version = "0.0.0-20260703014108", path = "../charming-x-ansi" }
unicode-segmentation = "1.10.1"
tokio = { version = "1.38", features = ["full"] }
tokio-stream = "0.1"
crossterm = "0.27"
futures = "0.3"

[dev-dependencies]
tokio-test = "0.4"

[lib]
name = "charming_bubbletea"
path = "src/lib.rs"
